<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>list-pokemons</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- <pre style="max-height: 400px; overflow-y: auto;">{{ pokemons() | json }}</pre> -->

  <ion-grid>
    @for (pokemon of pokemons(); track pokemon.id) {
    <ion-row class="ion-align-items-center" (click)="goToDetail(pokemon)">
      <ion-col size="3">
        <ion-img [src]="pokemon.sprite"></ion-img>
      </ion-col>
      <ion-col size="4">
        <ion-text class="ion-text-capitalize">
          {{ pokemon.name }}
        </ion-text>
      </ion-col>
      <ion-col size="2">
        <ion-text>
          <ion-img [src]="'assets/img/'+pokemon.type1+'.gif'"></ion-img>
        </ion-text>
      </ion-col>
      <ion-col size="2">
        @if(pokemon.type2){
          <ion-text>
            <ion-img [src]="'assets/img/'+pokemon.type2+'.gif'"></ion-img>
          </ion-text>
        }
      </ion-col>
    </ion-row>
    }
  </ion-grid>

  <ion-infinite-scroll threshold="50px" (ionInfinite)="morePokemons($event)">
    <ion-infinite-scroll-content
      loadingText="Cargando..."
      loadingSpinner="bubbles" />
  </ion-infinite-scroll>
</ion-content>
